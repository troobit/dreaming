[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dreaming"
version = "0.1.0"
description = "Evidence-based learning from locally recorded agent sessions"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
dream = "dreaming.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "hypothesis>=6.120,<7", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dreaming"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: opt-in checks against installed harnesses and apsis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
