[project]
name = "dreaming"
version = "0.1.0"
description = "Turns evidence from past agent sessions into retained knowledge."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dream = "dreaming.cli:main"

[dependency-groups]
dev = [
    "hypothesis",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreaming"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: runs against the installed claude, codex, LM Studio and apsis (make test-live)",
]
addopts = "-m 'not live'"
